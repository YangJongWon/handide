<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 백그라운드 그라데이션 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14" />
      <stop offset="100%" stop-color="#141824" />
    </linearGradient>

    <!-- VS Code 블루 & 커넥션 циаn 그라데이션 -->
    <linearGradient id="qrBrandBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
  </defs>

  <!-- 1. 배경 프레임 -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="8" />

  <!-- 2. QR 코드의 핵심 '파인더 패턴(Finder Pattern)' 외곽 브래킷 -->
  <g fill="none" stroke="url(#qrBrandBlue)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- 좌상단 QR 파인더 -->
    <path d="M 120 180 L 120 130 C 120 120 120 120 130 120 L 180 120" />
    <!-- 우상단 QR 파인더 -->
    <path d="M 332 120 L 382 120 C 392 120 392 120 392 130 L 392 180" />
    <!-- 좌하단 QR 파인더 -->
    <path d="M 120 332 L 120 382 C 120 392 120 392 130 392 L 180 392" />
    <!-- 우하단 QR 파인더 -->
    <path d="M 332 392 L 382 392 C 392 392 392 392 392 382 L 392 332" />
  </g>

  <!-- 3. QR 픽셀 데이터 패턴 (모바일 주변 마이크로 도트 매트릭스) -->
  <g fill="#2A3550" opacity="0.7">
    <rect x="156" y="220" width="12" height="12" rx="3" />
    <rect x="180" y="220" width="12" height="12" rx="3" />
    <rect x="156" y="244" width="12" height="12" rx="3" />
    
    <rect x="320" y="220" width="12" height="12" rx="3" />
    <rect x="344" y="220" width="12" height="12" rx="3" />
    <rect x="344" y="244" width="12" height="12" rx="3" />

    <rect x="156" y="320" width="12" height="12" rx="3" />
    <rect x="180" y="344" width="12" height="12" rx="3" />
    
    <!-- 액티브 데이터셀 -->
    <rect x="320" y="344" width="12" height="12" rx="3" fill="#00E5FF" />
    <rect x="344" y="320" width="12" height="12" rx="3" fill="#00E5FF" />
  </g>

  <!-- 4. 중앙 핵심: 모바일 에디터 화면 -->
  <rect x="192" y="152" width="128" height="208" rx="24" fill="#0E121C" stroke="url(#qrBrandBlue)" stroke-width="10" />

  <!-- 모바일 내부 에디터 코드 라인 -->
  <g stroke-linecap="round" stroke-width="8">
    <line x1="216" y1="184" x2="256" y2="184" stroke="#00E5FF" />
    <line x1="228" y1="208" x2="284" y2="208" stroke="#6366F1" />
    <line x1="228" y1="232" x2="260" y2="232" stroke="#E2E8F0" />
    <!-- 터미널 커서 심볼 -->
    <line x1="228" y1="264" x2="252" y2="280" stroke="#00E5FF" stroke-width="6" />
    <line x1="228" y1="296" x2="276" y2="296" stroke="#00E5FF" stroke-width="6" />
  </g>
</svg>