<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 백그라운드 그라데이션 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E" />
      <stop offset="100%" stop-color="#141B2D" />
    </linearGradient>

    <!-- 선명한 VS Code 블루 & 시안 그라데이션 -->
    <linearGradient id="qrBrandBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
  </defs>

  <!-- 1. 배경 프레임 -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="8" />

  <!-- 2. QR 코드 파인더 패턴 -->
  <g fill="none" stroke="url(#qrBrandBlue)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 116 188 L 116 126 C 116 116 116 116 126 116 L 188 116" />
    <path d="M 324 116 L 386 116 C 396 116 396 116 396 126 L 396 188" />
    <path d="M 116 324 L 116 386 C 116 396 116 396 126 396 L 188 396" />
    <path d="M 324 396 L 386 396 C 396 396 396 396 396 386 L 396 324" />
  </g>

  <!-- 3. QR 픽셀 데이터 패턴 (좌우 1열씩 확장 및 밝은 명도 적용) -->
  <g fill="#60A5FA" opacity="0.95">
    <!-- 좌측 확장 열 -->
    <rect x="134" y="212" width="14" height="16" rx="4" />
    <rect x="134" y="240" width="14" height="16" rx="4" />
    <rect x="134" y="312" width="14" height="16" rx="4" />

    <!-- 기존 중앙-좌측 도트 -->
    <rect x="154" y="212" width="14" height="16" rx="4" />
    <rect x="178" y="212" width="14" height="16" rx="4" />
    <rect x="154" y="240" width="14" height="16" rx="4" />
    <rect x="154" y="312" width="14" height="16" rx="4" />
    <rect x="178" y="340" width="14" height="16" rx="4" />
    
    <!-- 기존 중앙-우측 도트 & 포인트 액티브셀 -->
    <rect x="316" y="212" width="14" height="16" rx="4" />
    <rect x="340" y="212" width="14" height="16" rx="4" />
    <rect x="340" y="240" width="14" height="16" rx="4" />
    <rect x="316" y="340" width="14" height="16" rx="4" fill="#22D3EE" />
    <rect x="340" y="312" width="14" height="16" rx="4" fill="#22D3EE" />

    <!-- 우측 확장 열 -->
    <rect x="360" y="212" width="14" height="16" rx="4" />
    <rect x="360" y="240" width="14" height="16" rx="4" />
    <rect x="360" y="312" width="14" height="16" rx="4" />
  </g>

  <!-- 4. 중앙 모바일 에디터 화면 -->
  <rect x="188" y="148" width="136" height="216" rx="26" fill="#0A0E17" stroke="url(#qrBrandBlue)" stroke-width="12" />

  <!-- 모바일 내부 에디터 코드 라인 -->
  <g stroke-linecap="round" stroke-width="10">
    <line x1="214" y1="184" x2="258" y2="184" stroke="#22D3EE" />
    <line x1="224" y1="212" x2="288" y2="212" stroke="#818CF8" />
    <line x1="224" y1="240" x2="264" y2="240" stroke="#F1F5F9" />
    <!-- 터미널 커서 심볼 -->
    <line x1="224" y1="274" x2="252" y2="294" stroke="#22D3EE" stroke-width="8" />
    <line x1="224" y1="310" x2="282" y2="310" stroke="#22D3EE" stroke-width="8" />
  </g>
</svg>